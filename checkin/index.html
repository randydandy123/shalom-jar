<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ferment Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Fermentulator look: tape and steel. Status colours are never used here. */
  :root {
    --paper: #FAFAF7; --ink: #111111; --ink-2: #4b4d4f; --steel: #C9CCCE;
    --tape: #4A8CC2; --tape-text: #06192A; --brine: #D6E6F3; --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121212; --ink: #F2F2EE; --ink-2: #b4b6b2; --steel: #3a3d3f;
      --tape: #6FA8D6; --tape-text: #06192A; --brine: #1d2a35; --card: #1a1a1a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121212; --ink: #F2F2EE; --ink-2: #b4b6b2; --steel: #3a3d3f;
    --tape: #6FA8D6; --tape-text: #06192A; --brine: #1d2a35; --card: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "DM Sans", Arial, sans-serif; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font: 40px/1 Anton, Impact, sans-serif; text-transform: uppercase; margin: 6px 0 4px; letter-spacing: .5px; }
  h2 { font: 22px/1.1 Anton, Impact, sans-serif; text-transform: uppercase; margin: 0 0 4px; letter-spacing: .4px; }
  .tape { display: inline-block; background: var(--tape); color: var(--tape-text); font: 600 22px/1.2 Caveat, cursive; padding: 2px 12px; transform: rotate(-1.5deg); }
  .mono { font-family: "Space Mono", monospace; }
  .sub { color: var(--ink-2); margin: 8px 0 0; }

  .jars { display: flex; gap: 8px; margin: 22px 0 12px; flex-wrap: wrap; }
  .jars button { flex: 1 1 140px; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; text-align: left; font: inherit; cursor: pointer; }
  .jars button b { display: block; font: 18px/1.1 Anton, sans-serif; text-transform: uppercase; }
  .jars button span { font: 12px "Space Mono", monospace; color: var(--ink-2); }
  .jars button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .jars button[aria-pressed="true"] span { color: var(--steel); }

  .daybar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--brine); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
  .daybar .big { font: 34px/1 Anton, sans-serif; text-transform: uppercase; }
  .daybar button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer; }
  .daybar .meta { font: 12px "Space Mono", monospace; color: var(--ink-2); width: 100%; }
  .daybar input { font: 12px "Space Mono", monospace; border: 1px solid var(--steel); background: var(--card); color: var(--ink); border-radius: 6px; padding: 2px 6px; }
  .other { display: none; gap: 8px; margin: -4px 0 14px; }
  .other.on { display: flex; }
  .other input { flex: 1; font: inherit; padding: 8px 10px; border: 1.5px solid var(--steel); border-radius: 8px; background: var(--card); color: var(--ink); }

  section { background: var(--card); border: 1px solid var(--steel); border-radius: 14px; padding: 16px; margin: 14px 0; }
  section .why { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
  .n { font: 700 12px "Space Mono", monospace; color: var(--tape); margin-right: 4px; }

  label.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px dashed var(--steel); cursor: pointer; }
  label.check:first-of-type { border-top: 0; }
  label.check input { appearance: none; flex: 0 0 26px; height: 26px; border: 2px solid var(--ink); border-radius: 6px; margin: 0; background: var(--card); cursor: pointer; display: grid; place-content: center; }
  label.check input:checked { background: var(--ink); }
  label.check input:checked::after { content: ""; width: 7px; height: 13px; border: solid var(--paper); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-2px); }
  label.check input:checked + div .t { text-decoration: line-through; color: var(--ink-2); }
  .t { font-weight: 500; }
  .d { display: block; font-size: 14px; color: var(--ink-2); }
  .hint { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .hint b { color: var(--ink); font-weight: 500; }

  .say { border-top: 1px dashed var(--steel); padding: 12px 0 4px; }
  .say:first-of-type { border-top: 0; }
  .say .row { display: flex; gap: 12px; align-items: flex-start; }
  .say .line { font: 600 21px/1.2 Caveat, cursive; color: var(--ink); margin: 2px 0 6px; }
  textarea { width: 100%; min-height: 54px; resize: vertical; font: 15px/1.4 "DM Sans", sans-serif; padding: 8px 10px; border: 1.5px solid var(--steel); border-radius: 8px; background: var(--paper); color: var(--ink); }
  textarea:focus, .other input:focus { outline: 2px solid var(--tape); border-color: var(--tape); }

  .rules { list-style: none; padding: 0; margin: 0; }
  .rules li { padding: 6px 0 6px 22px; position: relative; font-size: 15px; }
  .rules li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 10px; height: 4px; background: var(--tape); }

  .progress { height: 6px; background: var(--steel); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .progress i { display: block; height: 100%; background: var(--tape); width: 0; transition: width .2s; }

  .send { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--steel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .send .in { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .send .count { font: 12px "Space Mono", monospace; color: var(--ink-2); flex: 1; }
  .send button { border: 0; background: var(--ink); color: var(--paper); font: 700 16px "DM Sans", sans-serif; padding: 13px 18px; border-radius: 10px; cursor: pointer; }

  .log { font: 13px "Space Mono", monospace; color: var(--ink-2); }
  .log div { padding: 4px 0; border-top: 1px dashed var(--steel); }
  .log div:first-child { border-top: 0; }

  .editbtn { display: none; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); font: 700 14px "DM Sans", sans-serif; padding: 8px 14px; border-radius: 10px; cursor: pointer; float: right; }
  .local .editbtn { display: inline-block; }
  .ed { border-top: 1px dashed var(--steel); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; }
  .ed:first-of-type { border-top: 0; }
  .ed input[type=text], .ed textarea, .edhead input, .edhead textarea { width: 100%; font: 15px/1.4 "DM Sans", sans-serif; padding: 7px 9px; border: 1.5px solid var(--steel); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .ed .t-in { font-weight: 700; }
  .edhead input { font: 20px Anton, sans-serif; text-transform: uppercase; margin-bottom: 6px; }
  .edhead textarea { min-height: 44px; margin-bottom: 8px; }
  .tools { display: flex; flex-direction: column; gap: 4px; grid-row: span 3; }
  .tools button, .add { border: 1px solid var(--steel); background: var(--card); color: var(--ink); border-radius: 8px; width: 34px; height: 30px; cursor: pointer; font-size: 15px; }
  .tools .del { color: #b33; }
  .add { width: auto; padding: 0 14px; height: 38px; margin-top: 8px; font: 600 14px "DM Sans", sans-serif; }
  .boxopt { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .saved { font: 12px "Space Mono", monospace; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <button class="editbtn" id="editBtn">Edit lines</button>
  <span class="tape">one jar, every day, same frame</span>
  <h1>Ferment check-in</h1>
  <p class="sub">Pick the jar, check the day, then tick each shot as you film it. Your notes stay on this phone. When you're done, press <b>Send to Sharon</b>.</p>

  <div class="jars" id="jars"></div>
  <div class="other" id="other">
    <input id="otherName" placeholder="Which ferment? e.g. Shio koji">
    <input id="otherStart" type="date" aria-label="Day 1 date" style="flex:0 0 150px">
  </div>

  <div class="daybar">
    <button id="dayDown" aria-label="Previous day">&minus;</button>
    <div class="big" id="dayLabel">Day 1</div>
    <button id="dayUp" aria-label="Next day">+</button>
    <div class="meta" id="dayMeta"></div>
  </div>

  <div id="sections"></div>
  <div class="progress"><i id="bar"></i></div>

  <section>
    <h2>Sent so far</h2>
    <div class="log" id="log"></div>
  </section>
</div>

<div class="send"><div class="in">
  <div class="count" id="count"></div>
  <button id="sendBtn">Send to Sharon</button>
</div></div>

<script>
const JARS = [
  { id: "starter", name: "Sourdough race", say: "my sourdough starter race", note: "daily · day 1 to 7", start: "2026-10-08", unit: "day",
    see: "Which jar is higher against its rubber band, Apple or Water? Bubbles on the side, the smell, the top." },
  { id: "miso", name: "Bread miso", say: "my bread miso", note: "weekly check-in", start: "2026-10-08", unit: "week",
    see: "The surface under the lid, the colour, any liquid on top, any spots. Is it something to worry about or not?" },
  { id: "other", name: "Other jar", note: "name it below", start: "", unit: "day", see: "" }
];

let DATA = null;
const local = ["localhost", "127.0.0.1"].includes(location.hostname);
let editing = false;

const KEY = "ferment-checkin-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

store.jar = store.jar || "starter";
store.other = store.other || { name: "", start: "" };
store.entries = store.entries || {};
store.sent = store.sent || [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function jar() {
  const j = { ...JARS.find(x => x.id === store.jar) };
  if (j.id === "other") { j.name = store.other.name || "your jar"; j.say = j.name; j.start = store.other.start; }
  return j;
}
function dayFromStart(start) {
  if (!start) return 1;
  const s = new Date(start + "T00:00:00"), t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.max(1, Math.round((t - s) / 864e5) + 1);
}
function currentDay() {
  const j = jar(), k = "day_" + j.id;
  return store[k] || dayFromStart(j.start);
}
function entryKey() { return jar().id + "|" + currentDay(); }
function entry() { return store.entries[entryKey()] || (store.entries[entryKey()] = { checks: {}, notes: {} }); }

const fill = (t, j, day) => t.replace("{day}", day).replace("{jar}", j.say || j.name);
const countable = () => DATA.sections.filter(s => s.kind !== "rules").reduce((n, s) => n + s.lines.length, 0);

function checkRow(L, hint) {
  const on = entry().checks[L.id] ? "checked" : "";
  return `<label class="check"><input type="checkbox" data-c="${L.id}" ${on}><div><span class="t">${esc(L.t)}</span><span class="d">${esc(L.d || "")}</span>${hint ? `<span class="hint"><b>Today, look for:</b> ${esc(hint)}</span>` : ""}</div></label>`;
}

function viewSection(sec, j, day) {
  const e = entry();
  let body = "";
  if (sec.kind === "rules") body = `<ul class="rules">${sec.lines.map(L => `<li>${esc(L.t)}</li>`).join("")}</ul>`;
  else if (sec.kind === "talk") body = sec.lines.map(L => {
    const on = e.checks[L.id] ? "checked" : "";
    return `<div class="say"><label class="check" style="border:0;padding:0"><input type="checkbox" data-c="${L.id}" ${on}><div><div class="line">${esc(fill(L.t, j, day))}</div><span class="d">${esc(L.d || "")}</span></div></label>${L.box ? `<textarea data-n="${L.id}" placeholder="A few words...">${esc(e.notes[L.id] || "")}</textarea>` : ""}</div>`;
  }).join("");
  else body = sec.lines.map(L => checkRow(L, L.hint ? j.see : "")).join("");
  return `<section><h2>${esc(sec.title)}</h2>${sec.why ? `<p class="why">${esc(sec.why)}</p>` : ""}${body}</section>`;
}

function editSection(sec, si) {
  const rows = sec.lines.map((L, li) => `<div class="ed">
      <input type="text" class="t-in" data-s="${si}" data-l="${li}" data-f="t" value="${esc(L.t)}" placeholder="The line">
      <div class="tools"><button data-mv="${si},${li},-1" title="Move up">↑</button><button data-mv="${si},${li},1" title="Move down">↓</button><button class="del" data-del="${si},${li}" title="Delete">✕</button></div>
      ${sec.kind === "rules" ? "" : `<textarea data-s="${si}" data-l="${li}" data-f="d" placeholder="Small text under it (optional)">${esc(L.d || "")}</textarea>`}
      ${sec.kind === "talk" ? `<label class="boxopt"><input type="checkbox" data-s="${si}" data-l="${li}" data-f="box" ${L.box ? "checked" : ""}> Note box for Shalom</label>` : ""}
    </div>`).join("");
  return `<section><div class="edhead"><input data-s="${si}" data-f="title" value="${esc(sec.title)}"><textarea data-s="${si}" data-f="why" placeholder="Intro under the heading (optional)">${esc(sec.why || "")}</textarea></div>${rows}<button class="add" data-add="${si}">+ Add line</button></section>`;
}

function render() {
  if (!DATA) return;
  const j = jar(), day = currentDay();
  $("jars").innerHTML = JARS.map(x => `<button aria-pressed="${x.id === store.jar}" data-j="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.note)}</span></button>`).join("");
  $("other").classList.toggle("on", j.id === "other");
  $("otherName").value = store.other.name; $("otherStart").value = store.other.start;
  $("dayLabel").textContent = "Day " + day;
  const week = j.unit === "week" ? ` · week ${Math.floor((day - 1) / 7) + 1}` : "";
  $("dayMeta").innerHTML = (j.start ? `Day 1 was ${esc(j.start)}${week}. ` : "Set the Day 1 date above. ") + "Wrong number? Use the − and +.";

  $("sections").innerHTML = DATA.sections.map((sec, si) => editing ? editSection(sec, si) : viewSection(sec, j, day)).join("");
  $("editBtn").textContent = editing ? "Back to Shalom's view" : "Edit lines";
  $("sendBtn").textContent = editing ? "Save changes" : "Send to Sharon";

  const sent = store.sent.filter(s => s.jar === j.id);
  $("log").innerHTML = sent.length ? sent.slice().reverse().map(s => `<div>Day ${s.day} · sent ${esc(s.at)}</div>`).join("") : "<div>Nothing sent yet for this jar.</div>";
  progress();
}

function progress() {
  if (editing) { $("count").innerHTML = `<span class="saved" id="savedMsg">${dirty ? "Not saved yet" : "Saved"}</span>`; return; }
  const total = countable();
  const ids = new Set(DATA.sections.filter(s => s.kind !== "rules").flatMap(s => s.lines.map(L => L.id)));
  const done = Object.entries(entry().checks).filter(([k, v]) => v && ids.has(k)).length;
  $("bar").style.width = Math.round(done / total * 100) + "%";
  $("count").textContent = `${done} of ${total} ticked · Day ${currentDay()}`;
}

let dirty = false;
const touch = () => { dirty = true; const m = $("savedMsg"); if (m) m.textContent = "Not saved yet"; };

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-j]");
  if (b) { store.jar = b.dataset.j; save(); render(); return; }
  const mv = ev.target.closest("[data-mv]");
  if (mv) {
    const [si, li, d] = mv.dataset.mv.split(",").map(Number), arr = DATA.sections[si].lines, to = li + d;
    if (to >= 0 && to < arr.length) { [arr[li], arr[to]] = [arr[to], arr[li]]; touch(); render(); }
    return;
  }
  const del = ev.target.closest("[data-del]");
  if (del) { const [si, li] = del.dataset.del.split(",").map(Number); DATA.sections[si].lines.splice(li, 1); touch(); render(); return; }
  const add = ev.target.closest("[data-add]");
  if (add) {
    const sec = DATA.sections[+add.dataset.add];
    sec.lines.push({ id: "x" + Date.now().toString(36), t: "", d: "", box: sec.kind === "talk" ? true : undefined });
    touch(); render();
    const ins = document.querySelectorAll(`[data-s="${add.dataset.add}"][data-f="t"]`); ins[ins.length - 1].focus();
  }
});
document.addEventListener("change", ev => {
  const c = ev.target.dataset.c;
  if (c) { entry().checks[c] = ev.target.checked; save(); progress(); }
  if (ev.target.dataset.f === "box") { DATA.sections[ev.target.dataset.s].lines[ev.target.dataset.l].box = ev.target.checked; touch(); }
});
document.addEventListener("input", ev => {
  const n = ev.target.dataset.n;
  if (n) { entry().notes[n] = ev.target.value; save(); return; }
  const f = ev.target.dataset.f;
  if (f && f !== "box") {
    const sec = DATA.sections[ev.target.dataset.s];
    if (ev.target.dataset.l === undefined) sec[f] = ev.target.value; else sec.lines[ev.target.dataset.l][f] = ev.target.value;
    touch();
  }
});
$("otherName").addEventListener("change", ev => { store.other.name = ev.target.value.trim(); save(); render(); });
$("otherStart").addEventListener("change", ev => { store.other.start = ev.target.value; delete store["day_other"]; save(); render(); });
$("dayDown").onclick = () => { store["day_" + jar().id] = Math.max(1, currentDay() - 1); save(); render(); };
$("dayUp").onclick = () => { store["day_" + jar().id] = currentDay() + 1; save(); render(); };
$("editBtn").onclick = () => {
  if (editing && dirty && !confirm("You have changes that are not saved. Leave without saving?")) return;
  if (editing && dirty) { location.reload(); return; }
  editing = !editing; render(); scrollTo(0, 0);
};

async function saveLines() {
  DATA.sections.forEach(sec => sec.lines = sec.lines.filter(L => L.t.trim()));
  const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(DATA, null, 2) });
  if (!r.ok) { alert("Saving failed: " + await r.text()); return; }
  dirty = false; render();
}

$("sendBtn").onclick = () => {
  if (editing) { saveLines(); return; }
  const j = jar(), day = currentDay(), e = entry();
  const tick = L => (e.checks[L.id] ? "✓ " : "✗ ") + (L.box ? L.t : fill(L.t, j, day));
  const lines = [`Day ${day} of ${j.name}`];
  DATA.sections.filter(s => s.kind !== "rules").forEach(sec => {
    lines.push("", sec.title + ":");
    sec.lines.forEach(L => { lines.push(tick(L)); if (L.box && e.notes[L.id]) lines.push("   " + e.notes[L.id].trim()); });
  });
  window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank");
  store.sent.push({ jar: j.id, day, at: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short" }) });
  save(); render();
};

if (local) document.body.classList.add("local");
fetch("checklist.json?" + Date.now()).then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { $("sections").innerHTML = "<section>Could not load the checklist. Check your connection and refresh.</section>"; });
</script>
</body>
</html>
